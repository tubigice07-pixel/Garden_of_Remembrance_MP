<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GCash Payment</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background: #f1f5f9;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 14px;
    }

    .clean-card {
      background: #ffffff;
      border-radius: 20px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.08), 0 20px 25px -5px rgba(0, 0, 0, 0.04);
      border: 1px solid #e2e8f0;
      overflow: hidden;
      text-align: center;
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid #f1f5f9;
    }

    .brand-logo {
      height: 24px;
      width: auto;
      display: block;
    }

    .card-content {
      padding: 24px 22px;
    }

    .amount-subtitle {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #64748b;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .amount-display {
      font-size: 2.2rem;
      font-weight: 800;
      color: #005ce6;
      letter-spacing: -0.03em;
      line-height: 1.1;
      margin-bottom: 6px;
    }

    .booking-meta {
      font-size: 0.84rem;
      color: #475569;
      font-weight: 500;
      margin-bottom: 18px;
    }

    .qr-wrapper {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 16px;
      display: inline-block;
      margin-bottom: 16px;
    }

    .qr-image {
      width: 210px;
      height: 210px;
      object-fit: contain;
      display: block;
      border-radius: 8px;
      background: #ffffff;
      border: 1px solid #cbd5e1;
    }

    .scan-helper {
      font-size: 0.82rem;
      color: #64748b;
      margin-bottom: 16px;
      font-weight: 500;
    }

    .account-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 10px 14px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-align: left;
    }

    .acc-name {
      font-size: 0.82rem;
      font-weight: 600;
      color: #0f172a;
    }

    .acc-num {
      font-size: 0.92rem;
      font-weight: 700;
      color: #005ce6;
      font-family: monospace;
    }

    .btn-copy {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      color: #334155;
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }

    .btn-copy:hover {
      background: #f1f5f9;
      color: #005ce6;
    }

    .btn-confirm {
      background: #005ce6;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      width: 100%;
      padding: 14px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(0, 92, 230, 0.3);
      transition: all 0.2s;
    }

    .btn-confirm:hover {
      background: #0047b3;
      transform: translateY(-1px);
    }

    .card-bottom {
      padding: 12px 20px 18px;
      font-size: 0.78rem;
      color: #94a3b8;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
  </style>
</head>

<body>

  <div class="clean-card">
    <div class="card-top">
      <img src="assets/gcash-logo.png" alt="GCash" class="brand-logo">
      <span style="font-size:0.78rem;color:#64748b;font-weight:600;"><i class="fas fa-shield-alt text-success"></i>
        Secure</span>
    </div>

    <div class="card-content">
      <div class="amount-subtitle">Total Amount to Pay</div>
      <div id="amountDisplay" class="amount-display">PHP 100.00</div>
      <div id="orderDisplay" class="booking-meta">Order #ORD-2026-001</div>

      <div class="qr-wrapper">
        <img src="gcashqr1.jpg" alt="GCash QR Code" class="qr-image">
      </div>

      <div class="scan-helper">
        Scan using the <strong>GCash app</strong>
      </div>

      <div class="account-box">
        <div>
          <div id="merchantName" class="acc-name">Garden of Remembrance</div>
          <div id="merchantMobile" class="acc-num">0917 823 4567</div>
        </div>
        <button type="button" class="btn-copy" onclick="copyMobile()">
          <i class="fas fa-copy"></i> Copy
        </button>
      </div>

      <button id="payBtn" type="button" class="btn-confirm">
        <i class="fas fa-check-circle"></i> Pay
      </button>
    </div>

    <div class="card-bottom">
      Garden of Remembrance Memorial Park
    </div>
  </div>

  <script>
    const merchant = {
      name: "Garden of Remembrance",
      order: "ORD-2026-001",
      amount: 100.00,
      mobile: "09178234567",
      display_mobile: "0917 823 4567"
    };

    function copyMobile() {
      navigator.clipboard.writeText(merchant.mobile).then(() => {
        alert('GCash number copied!');
      }).catch(() => { });
    }

    document.getElementById('payBtn').addEventListener('click', function () {
      this.disabled = true;
      this.innerHTML = '<i class="fas fa-check"></i> Paid';
      setTimeout(() => {
        window.location.href = 'payment-success.php';
      }, 600);
    });
  </script>
</body>

</html>
